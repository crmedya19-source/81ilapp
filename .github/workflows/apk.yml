name: APK yap
on:
  push:
    paths-ignore:
      - 'sorular/**'
      - 'privacy.html'
      - 'veri-silme.html'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dosyaları yerleştir
        run: |
          mkdir -p www resources
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f icon.png ]; then cp icon.png resources/icon.png; fi
          if [ -f splash.png ]; then cp splash.png resources/splash.png; fi
          ls -R www resources
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore; fi
      - name: Paketleri kur
        run: npm install --legacy-peer-deps
      - name: Android projesini oluştur
        run: npx cap add android
      - name: Firebase ve bildirim ikonu
        run: |
          echo "" | base64 -d > android/app/google-services.json
          grep -c "com.il81.oyun" android/app/google-services.json
          grep -n "google-services" android/app/build.gradle android/build.gradle || true
          for d in bildirim-ikon/drawable-*; do mkdir -p android/app/src/main/res/$(basename $d); cp $d/ic_stat_bs.png android/app/src/main/res/$(basename $d)/; done
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="bs_turuncu">#F59E0B</color></resources>\n' > android/app/src/main/res/values/bs_renk.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_bs"/>\n    <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/bs_turuncu"/>\n    </application>#' $M
          grep -n "default_notification" $M
      - name: Simgeleri üret
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a' || echo "simge üretilemedi"
      - name: AdMob kimliğini ekle
        env:
          ADMOB_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-6585740970632503~4365384207' }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\"/>\n    </application>#" $M
          grep -n "APPLICATION_ID" $M
      - name: Senkronize et
        run: npx cap sync android
      - name: Sürüm numarası
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -n "version" $G
      - name: APK derle
        run: |
          sed -i 's/var ADTEST=false;/var ADTEST=true;/' www/index.html && npx cap copy android
          grep -c 'var ADTEST=true;' www/index.html
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 81il-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yı direkt indirme linkine koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bilgi-savasi.apk
          gh release delete son -y --cleanup-tag || true
          gh release create son bilgi-savasi.apk -t "Son APK (1.0.${{ github.run_number }})" -n "Telefona kurmak için bilgi-savasi.apk dosyasını indir." --latest
      - name: Play Store paketi (AAB) derle ve imzala
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ]; then echo "İmza anahtarı eklenmemiş, AAB atlanıyor"; exit 0; fi
          sed -i 's/var ADTEST=true;/var ADTEST=false;/' www/index.html && npx cap copy android
          grep -c 'var ADTEST=false;' www/index.html
          cd android
          ./gradlew bundleRelease --no-daemon
          echo "$KS" | base64 -d > ../release.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.jks -storepass "$KP" app/build/outputs/bundle/release/app-release.aab il81
          rm ../release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: 81il-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
