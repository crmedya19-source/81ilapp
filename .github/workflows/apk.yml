name: APK yap
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dosyaları yerleştir
        run: |
          mkdir -p www resources
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f icon.png ]; then cp icon.png resources/icon.png; fi
          if [ -f splash.png ]; then cp splash.png resources/splash.png; fi
          ls -R www resources
      - name: Paketleri kur
        run: npm install
      - name: Android projesini oluştur
        run: npx cap add android
      - name: Simgeleri üret
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a' || echo "simge üretilemedi"
      - name: AdMob kimliğini ekle
        env:
          ADMOB_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\"/>\n    </application>#" $M
          grep -n "APPLICATION_ID" $M
      - name: Senkronize et
        run: npx cap sync android
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 81il-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
